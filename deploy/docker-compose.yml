# Central monitoring stack for an astral-spy fleet.
#
#   bring up:    docker compose -f deploy/docker-compose.yml up -d
#   tear down:   docker compose -f deploy/docker-compose.yml down
#   data lives:  named volumes vm-data, grafana-data (managed by Docker)
#
# Edit deploy/scrape.yml to add render hosts. VictoriaMetrics has a
# built-in Prometheus-compatible scraper, so we don't need a separate
# Prometheus or vmagent container.
#
# Why named volumes instead of bind mounts: Grafana's container runs as
# uid 472 and VM's runs as uid 1000 — a host bind mount created by root
# (which is what happens on first compose-up) ends up unwritable to those
# uids and the containers crash-loop. Named volumes let Docker manage
# ownership correctly. To get at the data, see "Backups" in deploy/README.md.

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.108.0
    container_name: astral-vm
    restart: unless-stopped
    ports:
      - "8428:8428"   # HTTP API / UI (vmui)
    volumes:
      - vm-data:/victoria-metrics-data
      - ./scrape.yml:/etc/scrape.yml:ro
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=12"   # months — keep a year by default
      - "--promscrape.config=/etc/scrape.yml"
      - "--httpListenAddr=:8428"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: astral-grafana
    restart: unless-stopped
    depends_on:
      - victoriametrics
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"

volumes:
  vm-data:
  grafana-data:
